<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">

  <!-- Tagebuch (hinten) -->
  <rect x="38" y="18" width="92" height="118" rx="6" fill="#1a2a3a" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="38" y="18" width="10" height="118" rx="3" fill="#2E75B6" opacity="0.7"/>

  <!-- Karten-Seite (warmes Papier) -->
  <rect x="10" y="34" width="100" height="80" rx="10" fill="#fffdf8" stroke="#c9a84c" stroke-width="1.5"/>

  <!-- Papier-Linien -->
  <line x1="22" y1="52" x2="98" y2="52" stroke="#e8d5a3" stroke-width="0.8"/>
  <line x1="22" y1="62" x2="98" y2="62" stroke="#e8d5a3" stroke-width="0.8"/>
  <line x1="22" y1="72" x2="98" y2="72" stroke="#e8d5a3" stroke-width="0.8"/>
  <line x1="22" y1="82" x2="98" y2="82" stroke="#e8d5a3" stroke-width="0.8"/>
  <line x1="22" y1="92" x2="98" y2="92" stroke="#e8d5a3" stroke-width="0.8"/>
  <line x1="22" y1="102" x2="98" y2="102" stroke="#e8d5a3" stroke-width="0.8"/>

  <!-- Rand-Linie links -->
  <line x1="30" y1="34" x2="30" y2="114" stroke="#f5a0a0" stroke-width="0.8" opacity="0.6"/>

  <!-- GPS-Route (amber/gold) -->
  <path d="M36 96 C44 84 50 100 60 78 C68 62 76 86 88 68"
        fill="none" stroke="#c9a84c" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Start-Punkt -->
  <circle cx="36" cy="96" r="4" fill="#43c98c" stroke="#fff" stroke-width="1.2"/>

  <!-- Zwischen-Punkte -->
  <circle cx="60" cy="78" r="2.5" fill="#c9a84c"/>
  <circle cx="76" cy="86" r="2.5" fill="#c9a84c" opacity="0.7"/>

  <!-- Location-Nadel -->
  <circle cx="88" cy="64" r="8" fill="#c9a84c" stroke="#e8d5a3" stroke-width="1.2"/>
  <circle cx="88" cy="64" r="3.5" fill="#fff" opacity="0.9"/>
  <path d="M88 72 L85 79 L88 77 L91 79 Z" fill="#c9a84c"/>

  <!-- Stift (MPD-Blau) -->
  <line x1="95" y1="100" x2="125" y2="70" stroke="#2E75B6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="125,70 120,75 128,78" fill="#2E75B6"/>
  <rect x="93" y="100" width="5" height="10" rx="1" transform="rotate(-45 96 105)" fill="#2E75B6" opacity="0.6"/>

</svg>
